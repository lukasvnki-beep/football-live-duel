<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football Live Duel</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live Duel">
<meta name="theme-color" content="#08111e">
<meta name="description" content="Pick 2 players from one match and duel a friend live.">
<meta property="og:title" content="⚽ You're invited to a Live Duel">
<meta property="og:description" content="Pick 2 players from the match and beat your friend live. Tap to join.">
<meta property="og:image" content="https://football-live-duel.vercel.app/icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, a screen at a time; dark matchday look from the concept doc (single deliberate theme). */
:root{
  --bg:#08111e; --panel:#111f31; --panel2:#17283c; --line:#294056;
  --text:#edf5ff; --muted:#a9bbcf; --accent:#64efb0; --accent-ink:#04261a;
  --gold:#ffd77c; --red:#ff6b6b; --yellow:#ffd23f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.num{font-variant-numeric:tabular-nums}
.screen{display:flex;flex-direction:column;gap:16px}

/* Home hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 20px 20px;background:
  radial-gradient(circle at 50% 120%,transparent 58px,rgba(100,239,176,.18) 59px,rgba(100,239,176,.18) 61px,transparent 62px),
  linear-gradient(90deg,transparent calc(50% - 1px),rgba(100,239,176,.14) calc(50% - 1px),rgba(100,239,176,.14) calc(50% + 1px),transparent calc(50% + 1px)),
  radial-gradient(circle at 85% 0%,#1c654f 0,transparent 55%),linear-gradient(160deg,#0f2a3a,#0a1626)}
.hero h1{font-size:3rem;font-weight:800;text-transform:uppercase;margin:6px 0 8px}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:30ch}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;min-width:0;width:100%}

.section-title{display:flex;justify-content:space-between;align-items:baseline}
.section-title h2{font-size:1.5rem;text-transform:uppercase}
.fixtures{display:flex;flex-direction:column;gap:10px}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;width:100%}
.fixture:active{transform:scale(.99)}
.fixture .comp{grid-column:1/-1;display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.team b{font-weight:600;font-size:.9rem;line-height:1.2}
.crest{position:relative;width:38px;height:44px;display:inline-grid;place-items:center;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}.crest svg{position:absolute;inset:0;width:100%;height:100%}.crest b{position:relative;font-family:var(--display);font-weight:800;font-size:.82rem;letter-spacing:.02em;margin-top:-6px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.vs{font-family:var(--display);font-weight:700;color:var(--muted);font-size:1.1rem}
.homehd h1{font-size:2.1rem;font-weight:800;text-transform:uppercase;margin:2px 0 0}.homehd h1 span{color:var(--accent)}
.morebtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.fixtures.compact{gap:8px}
.frow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.frow .crest{width:28px;height:33px}.frow .crest b{font-size:.62rem}
.frow .fn{display:flex;flex-direction:column;min-width:0}.frow .fn b{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fr{font-size:.72rem;text-align:right;min-width:52px}
.modesheet .mmatch{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center}.modesheet .mmatch b{font-size:.95rem}.modesheet .vs{color:var(--muted);font-size:.8rem}
.modes{display:flex;flex-direction:column;gap:8px}
.modeopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer}
.modeopt .mi{font-size:1.6rem}.modeopt b{display:block}.modeopt small{color:var(--muted)}
.modeopt[aria-pressed="true"]{border-color:var(--accent);background:rgba(100,239,176,.1)}.modeopt[disabled]{opacity:.45}
.fixture .go{grid-column:1/-1;margin-top:4px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px;font-weight:700}

.rules{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rules h3{font-size:1.15rem;text-transform:uppercase;margin-bottom:8px}
.ptable{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.9rem}
.ptable span:nth-child(even){font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--accent)} .neg{color:var(--red)}

/* Bottom nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(8,17,30,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabbar button{padding:10px;border-radius:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tabbar button[aria-current="page"]{color:var(--text);background:var(--panel)}
.tabbar svg{width:18px;height:18px}

/* Top bar for flow screens */
.topbar{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.topbar .t{min-width:0}
.topbar h2{font-size:1.35rem;text-transform:uppercase}

/* Draft */
.picker-head{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.picker-head h3{font-size:1.6rem;text-transform:uppercase}
.slots{display:flex;gap:6px}
.slot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.slot.on{background:var(--accent);border-color:var(--accent)}
.filter{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.filter button{padding:8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:.85rem}
.filter button[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:left}
.prow[aria-pressed="true"]{border-color:var(--accent);background:#12302d}
.prow .crest{width:30px;height:30px;font-size:.72rem}
.prow .nm{min-width:0}
.prow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.prow[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stars{color:var(--gold);font-size:.72rem;letter-spacing:1px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.actionbar div{max-width:480px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:14px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}

/* Pass screen */
.pass{min-height:65vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.pass .phone{width:72px;height:72px;border-radius:22px;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line)}
.pass h2{font-size:2.2rem;text-transform:uppercase}

/* Lineup reveal + live */
.board{position:relative;overflow:hidden;border-radius:20px;padding:16px 14px 14px;background:
  radial-gradient(circle at 50% 50%,transparent 44px,rgba(100,239,176,.13) 45px,rgba(100,239,176,.13) 46px,transparent 47px),
  linear-gradient(90deg,transparent calc(50% - .5px),rgba(100,239,176,.12) calc(50% - .5px),rgba(100,239,176,.12) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(135deg,#183c3a,#102236)}
.board .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.board .who{font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .big{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.board .lead .big{color:var(--accent)}
.clock{display:flex;flex-direction:column;align-items:center;gap:4px}
.clock .min{font-family:var(--display);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.status{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);display:flex;align-items:center;gap:5px;white-space:nowrap}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
.status.done .dot{display:none}
@keyframes blink{50%{opacity:.25}}
.matchscore{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:.85rem;font-weight:600}
.matchscore .s{font-family:var(--display);font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.matchscore .crest{width:22px;height:22px;font-size:.55rem}
.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.25)}}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.ctl{padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:.85rem}
.speed{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.speed button{padding:6px;border-radius:9px;font-weight:700;font-size:.8rem;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}

.lineups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lu{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lu h3{font-size:1rem;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.pp .crest{width:24px;height:24px;font-size:.55rem}
.pp .nm{min-width:0;font-size:.85rem;font-weight:600;line-height:1.2}
.pp .nm span{display:block;font-size:.7rem;color:var(--muted);font-weight:500}
.pp .pts{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.pp.off .nm{text-decoration:line-through;color:var(--muted)}

.feed{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ev.mine{border-color:rgba(100,239,176,.45)}
.ev.void{opacity:.7}
.ev .m{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .txt{min-width:0;font-size:.88rem}
.ev .txt b{font-weight:600}
.ev .ico{display:inline-block;width:12px;height:16px;border-radius:2px;vertical-align:-3px;margin-right:6px}
.chips{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chip{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.p1{background:rgba(100,239,176,.16);color:var(--accent)}
.chip.p2{background:rgba(255,215,124,.16);color:var(--gold)}
.chip.p3{background:rgba(124,196,255,.16);color:#7cc4ff}
.chip.p4{background:rgba(255,154,213,.16);color:#ff9ad5}
.mchips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.duel.multi .side:nth-child(odd){border-left:0}
.duel.multi .side:nth-child(n+3){border-top:1px solid var(--line)}
.npick{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.npick button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:inherit;font-weight:800;font-size:1rem}
.npick button[aria-pressed="true"]{border-color:var(--accent);background:rgba(100,239,176,.14);color:var(--accent)}
.drawlist{list-style:none;margin:0 auto;padding:0;display:flex;flex-direction:column;gap:6px;width:min(280px,100%)}
.drawlist li{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;opacity:.6;transition:opacity .3s,transform .3s}
.drawlist li.show{opacity:1;transform:scale(1.03)}
.drawlist .dn{font-family:var(--display);font-weight:800;color:var(--muted);width:1.2em}
.podium{display:flex;flex-direction:column;gap:6px}
.prank{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.prank.top{border-color:rgba(255,215,124,.5)}
.prank .m{width:1.6em;font-size:1.2rem}.prank b{flex:1}
.chip.neg{filter:saturate(1.3)}
.empty{color:var(--muted);text-align:center;padding:18px;font-size:.9rem;border:1px dashed var(--line);border-radius:14px}
.fresh{font-size:.72rem;color:var(--muted);text-align:center}

/* Result */
.result{text-align:center;padding:24px 16px;border-radius:20px;background:radial-gradient(circle at 50% 0%,rgba(255,215,124,.25),transparent 60%),linear-gradient(160deg,#16303a,#0e1d2e)}
.result .trophy{font-size:2.6rem;line-height:1}
.result h2{font-size:2.6rem;text-transform:uppercase;margin:8px 0 2px}
.result .final{font-family:var(--display);font-weight:800;font-size:3.2rem;font-variant-numeric:tabular-nums}
.breakdown{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.breakdown h3{font-size:1.1rem;text-transform:uppercase}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.88rem;padding-top:8px;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0;padding-top:0}
.brow .why{grid-column:1/-1;color:var(--muted);font-size:.78rem}
.chatfab{position:fixed;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:1.5rem;z-index:8;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
.chatfab .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
.chatsheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;height:min(72vh,560px);background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;z-index:10;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.chatsheet header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chatsheet header b{flex:1}
.chatsheet header button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:inherit;font-size:.8rem;cursor:pointer}
.chatlist{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--panel2);align-self:flex-start;word-wrap:break-word;font-size:.95rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.big{background:none;font-size:2.2rem;padding:0 4px}
.msg small{display:block;opacity:.65;font-size:.68rem;margin-top:2px}
.emorow{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;border-top:1px solid var(--line)}
.emorow button{font-size:1.5rem;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px 8px;cursor:pointer;flex:none}
.chatin{display:flex;gap:8px;padding:8px 14px 12px}
.chatin input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;color:var(--text);padding:10px 14px;font:inherit;font-size:16px}
.chatin button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.burst{position:fixed;left:50%;top:40%;font-size:5rem;z-index:11;pointer-events:none;animation:burst 1.6s ease-out forwards}
.burst span{display:block;font-size:.9rem;text-align:center;font-weight:700;background:var(--panel2);border-radius:999px;padding:2px 10px;margin-top:4px}
@keyframes burst{0%{transform:translate(-50%,0) scale(.4);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-120px) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{animation:none;transform:translateX(-50%);opacity:1}}

@keyframes pulse{50%{opacity:.3}}
/* ---- Duel screen (split layout) ---- */
.mstrip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.mstrip .tm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700}
.mstrip .tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstrip .tm.r{justify-content:flex-end;text-align:right}
.mstrip .g{font-family:var(--display);font-size:1.4rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.mstrip .ck{display:flex;flex-direction:column;align-items:center;gap:2px}

.dare-res{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:16px}
.dq{font-family:var(--display);font-size:1.4rem;font-weight:700;line-height:1.15}
.dare-res q{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.15;text-wrap:balance}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg3 button{padding:10px 4px;font-size:.85rem}
.invite{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.invite input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font:inherit;font-size:.85rem;width:100%}
.invite .dchips .btn{flex:1}
.btn.wa{background:#25d366;color:#04230f;font-weight:800;padding:14px;width:100%}
/* Moments */
.fx{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;animation:fxbg 1.8s ease-out forwards}
.fx-goal{animation-duration:2.4s;background:radial-gradient(circle at 50% 45%,rgba(100,239,176,.35),transparent 65%)}
.fx-goal.bad{background:radial-gradient(circle at 50% 45%,rgba(255,107,107,.3),transparent 65%)}
.fx-big{font-family:var(--display);font-weight:900;font-size:clamp(3.5rem,18vw,7rem);line-height:1;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.5);animation:fxin .55s cubic-bezier(.2,1.6,.4,1) both}
.fx-goal .fx-big{color:var(--accent);letter-spacing:2px}
.fx-goal.bad .fx-big{color:var(--red)}
.fx-sub{font-weight:800;background:var(--panel2);border-radius:999px;padding:6px 14px;max-width:86vw;text-align:center;animation:fxin .5s .15s ease-out both}
.fx-power.double{background:radial-gradient(circle,rgba(255,215,124,.35),transparent 60%)}
.fx-power.neg{background:radial-gradient(circle,rgba(255,107,107,.35),transparent 60%)}
.fx-power.shield{background:radial-gradient(circle,rgba(111,182,255,.35),transparent 60%)}
.fx-power .fx-big{font-size:clamp(5rem,26vw,9rem);animation:fxpow .9s cubic-bezier(.2,1.4,.4,1) both}
.fx-f10{background:radial-gradient(circle,rgba(255,120,60,.4),transparent 65%)}
.fx-f10 .fx-big{color:#ffb347;font-size:clamp(2.6rem,13vw,5rem)}
.conf{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:conf 1.9s ease-in forwards}
@keyframes fxbg{0%{opacity:0}10%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes fxin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes fxpow{0%{opacity:0;transform:scale(.2) rotate(-25deg)}60%{opacity:1;transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes conf{to{transform:translate(var(--dx),105vh) rotate(720deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pen{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:14px;background:linear-gradient(160deg,#123a33,var(--panel,#111f31));border:1px solid var(--accent,#64efb0)}
.pen b{font-family:var(--display);font-size:1.15rem;text-transform:uppercase}.pen .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pen .cd{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--gold,#ffd77c)}
.boost{text-align:center;font-family:var(--display);font-weight:900;letter-spacing:1px;padding:9px 12px;border-radius:14px;color:#04261a;background:linear-gradient(90deg,#64efb0,#ffd77c,#64efb0)}
#penov{position:fixed;inset:0;z-index:80;background:#08111e}#penov iframe{border:0;width:100%;height:100%}
#penov .x{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:1.1rem}
.f10{text-align:center;font-family:var(--display);font-weight:900;letter-spacing:1px;padding:9px 12px;border-radius:14px;color:#2a1000;background:linear-gradient(90deg,#ff7a3c,#ffd77c,#ff7a3c);background-size:200% 100%;animation:f10 2s linear infinite;box-shadow:0 0 22px rgba(255,140,60,.45)}
@keyframes f10{to{background-position:-200% 0}}
/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{background:var(--panel);border:1px solid var(--line,rgba(255,255,255,.08));border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center}
.badge .bi{font-size:1.8rem;line-height:1}
.badge b{font-size:.78rem}
.badge small{font-size:.66rem;color:var(--muted);line-height:1.2}
.badge.off{opacity:.38;filter:grayscale(1)}
.badge.on{border-color:var(--gold);box-shadow:0 0 14px rgba(255,215,124,.18)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fx{display:none}}
</style>

<script>

function matchScore(f){let v=LEAGUE_RANK[f.leagueId]||(TOP_LEAGUES.has(f.leagueId)?30:5);
  [f.home,f.away].forEach(t=>{if(BIG_CLUBS.has(clubLook(t).ab))v+=12});
  if(['PST','CANC','ABD','AWD','WO'].includes(f.status))v-=200;else if(FINAL.has(f.status))v-=60;else if(LIVE.has(f.status))v+=6;
  return v}
const TOP_LEAGUES=new Set([207,1,2,3,4,39,40,45,48,61,78,88,94,135,140,143,144,203,253,848,9,10]);

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// ================= Simulated (practice) data =================
const SIM_TEAMS={nor:['Northport FC','NOR','#5fb6ff'],val:['Valecrest United','VAL','#ff8a5c'],riv:['Riverside Athletic','RIV','#c39bff'],kin:['Kingsmoor City','KIN','#ffd77c'],har:['Harbor Town','HAR','#4fe0d2'],ash:['Ashford Rovers','ASH','#ff6f91'],eas:['Eastfield','EAS','#a8e05f'],wes:['Westbrook Albion','WES','#f2f2f2']};

const SHAPE=['GK','DEF','DEF','MID','MID','MID','FWD','FWD'];
Object.entries(SIM_TEAMS).forEach(([tid,[name,short,color]])=>{
  TEAMS[tid]={name,short,color};
  const r=rng(hash(tid));const used=new Set();
  SQUAD[tid]=SHAPE.map((pos,i)=>{let n;do{n=FIRST[Math.floor(r()*FIRST.length)]+' '+LAST[Math.floor(r()*LAST.length)]}while(used.has(n));used.add(n);
    const id=tid+i;PL[id]={id,team:tid,name:n,pos,form:1+Math.floor(r()*3)};return id});
});

// ================= Real data helpers =================
function teamKey(t){
  const k='t'+t.id;
  if(!TEAMS[k]){
    const words=t.name.replace(/\b(FC|CF|AFC|SC|AC|FK|SK|SV|CD|SD|UD|AS|SS|US|BK|IF|1\.|VfB|VfL|TSG|RCD|RC)\b/g,'').trim().split(/\s+/);
    const base=(words.find(w=>w.length>=3)||words[0]||t.name);
    const h=hash(t.name)%360;
    TEAMS[k]={name:t.name,short:base.slice(0,3).toUpperCase(),color:`hsl(${h} 72% 68%)`};
  }
  return k;
}
const POSMAP={G:'GK',D:'DEF',M:'MID',F:'FWD',Goalkeeper:'GK',Defender:'DEF',Midfielder:'MID',Attacker:'FWD'};
function regPlayer(p,tkey){
  if(!p||(!p.id&&!p.name))return null;
  const id=p.id?'p'+p.id:'n'+hash(tkey+'|'+p.name); // some smaller leagues send id 0
  if(!PL[id])PL[id]={id,team:tkey,name:p.name||'Unknown player',pos:POSMAP[p.pos||p.position]||'',num:p.number};
  else{if(p.name&&PL[id].name==='Unknown player')PL[id].name=p.name;if(!PL[id].pos&&(p.pos||p.position))PL[id].pos=POSMAP[p.pos||p.position]||'';if(PL[id].num==null&&p.number!=null)PL[id].num=p.number}
  return id;
}
async function api(path,params={}){
  const qs=new URLSearchParams({path,...params});
  let r,body;
  try{r=await fetch('/api/football?'+qs);body=await r.json()}catch(e){throw new Error('No connection to the app server. Check your internet and try again.')}
  if(body&&typeof body.requestsLeftToday==='number'){S.left=body.requestsLeftToday}
  if(body&&body.preview)S.preview=true;
  const errs=body&&body.errors;const msgs=errs?(Array.isArray(errs)?errs:Object.values(errs)):[];
  if(body&&body.unavailable){S.apiDown=true;const e=new Error('Live football data is unavailable right now. Practice matches still work.');e.down=true;throw e}
  S.apiDown=false;
  if(msgs.length)throw new Error(msgs.map(String).join(' '));
  if(!r.ok)throw new Error('The football data service answered with an error ('+r.status+').');
  return body.response||[];
}
const isoDay=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return ''}})();
const LIVE=new Set(['1H','HT','2H','ET','BT','P','LIVE','INT','SUSP']);
const FINAL=new Set(['FT','AET','PEN']);
function fxFromApi(x){
  const home=teamKey(x.teams.home),away=teamKey(x.teams.away);
  return {id:'r'+x.fixture.id,apiId:x.fixture.id,kind:'real',home,away,
    comp:x.league.name+(x.league.country&&x.league.country!=='World'?' · '+x.league.country:''),leagueId:x.league.id,
    kickoff:x.fixture.date,status:x.fixture.status.short,elapsed:x.fixture.status.elapsed,goals:x.goals,
    homeTeam:x.teams.home,awayTeam:x.teams.away};
}
function fxStatus(f){
  if(LIVE.has(f.status))return `<span class="fstat live">LIVE ${f.status==='HT'?'HT':(f.elapsed||'')+'′'}</span>`;
  if(FINAL.has(f.status))return `<span class="fstat ft">FT ${f.goals.home}–${f.goals.away}</span>`;
  if(['PST','CANC','ABD','AWD','WO'].includes(f.status))return `<span class="fstat">${f.status==='PST'?'Postponed':f.status==='CANC'?'Cancelled':'Abandoned'}</span>`;

// ================= App state =================
const S={
  view:'home',src:store.get('fld.src','real'),mode:store.get('fld.mode','friend'),
  names:store.get('fld.names',['You','Friend']),np:store.get('fld.np',2),

  eng:null,timer:null,speed:1,paused:false,
  history:store.get('fld.history',[]),capt:[0,0],swaps:[]
};
const app=document.getElementById('app');
const tabbar=document.getElementById('tabbar');
// Club shields: a plain generic shield in the club's two colours with a short name.
// Never the real badge (trademarks); just colours + letters so it feels familiar.

 [/^manchester united|^man utd/,'#da291c','#111111','MUN'],[/^manchester city/,'#6cabdd','#1c2c5b','MCI'],[/^liverpool/,'#c8102e','#f6eb61','LIV'],[/^arsenal/,'#ef0107','#ffffff','ARS'],[/^chelsea/,'#034694','#ffffff','CHE'],

 [/^real madrid/,'#ffffff','#febe10','RMA'],[/^barcelona/,'#a50044','#004d98','BAR'],[/^atletico madrid|^atl[eé]tico de madrid/,'#cb3524','#ffffff','ATM'],[/^sevilla/,'#ffffff','#d71920','SEV'],[/^valencia/,'#ffffff','#ee7623','VAL'],
 [/^villarreal/,'#ffe667','#005187','VIL'],[/^real sociedad/,'#0067b1','#ffffff','RSO'],[/^athletic/,'#ee2523','#ffffff','ATH'],[/^real betis/,'#00954c','#ffffff','BET'],[/^girona/,'#cd2534','#ffffff','GIR'],[/^celta/,'#8ac3ee','#ffffff','CEL'],
 [/^ac milan|^milan$/,'#fb090b','#111111','MIL'],[/^inter$|^inter milan|^internazionale/,'#0068a8','#111111','INT'],[/^juventus/,'#ffffff','#111111','JUV'],[/^napoli/,'#12a0d7','#ffffff','NAP'],[/^as roma|^roma$/,'#8e1f2f','#f0bc42','ROM'],
 [/^lazio/,'#87d8f7','#ffffff','LAZ'],[/^atalanta/,'#1e71b8','#111111','ATA'],[/^fiorentina/,'#482e92','#ffffff','FIO'],[/^bologna/,'#a21c26','#1a2f48','BOL'],[/^torino/,'#881f19','#ffffff','TOR'],[/^genoa/,'#a8172b','#1a2f5b','GEN'],

function startDuel(f,firstPicker=0){
  stopTimer();
  if(S.mode==='online'&&!S.joining){startOnline(f);return}
  S.joining=false;
  S.fixture=f;S.picks=ALL().map(()=>[]);S.capt=ALL().map(()=>0);S.swaps=[];S.dares=ALL().map(()=>'');S.dareOk=ALL().map(()=>false);S.turn=S.mode==='cpu'?0:S.mode==='online'?(S.online?S.online.slot:0):firstPicker;S.first=S.turn;S.filter='all';S.eng=null;S.draftErr=null;
  S.ldraft=null;
  if(S.mode==='friend'&&multi()){const seq=shuffled(ALL());S.ldraft={first:seq[0],seq,order:[]};S.turn=seq[0];S.first=seq[0];go('lflip')}
  else if(S.mode==='friend'){S.ldraft={first:Math.random()<.5?0:1,order:[]};S.turn=S.ldraft.first;S.first=S.turn;go('lflip')}else go('draft');
  if(f.kind==='real'&&!(SQUAD[f.home]&&SQUAD[f.home].length&&SQUAD[f.away]&&SQUAD[f.away].length))loadPlayers(f);
}
async function loadPlayers(f){
  S.draftLoading=true;S.draftErr=null;if(S.view==='draft')viewDraft();
  try{
    let lu=[];try{lu=await api('fixtures/lineups',{fixture:f.apiId})}catch(e){lu=[]}
    if(lu.length>=2){
      lu.forEach(t=>{const k=teamKey(t.team);SQUAD[k]=[...(t.startXI||[]),...(t.substitutes||[])].map(x=>regPlayer(x.player,k)).filter(Boolean);
        (t.startXI||[]).forEach(x=>{const id='p'+x.player.id;if(PL[id])PL[id].starter=true})});
      f.lineupsOut=true;
    }else{
      for(const side of ['homeTeam','awayTeam']){
        const k=teamKey(f[side]);const sq=await api('players/squads',{team:f[side].id});
        SQUAD[k]=((sq[0]&&sq[0].players)||[]).map(p=>regPlayer(p,k)).filter(Boolean);
      }

function cpuPicks(f){
  let pool=[...(SQUAD[f.home]||[]),...(SQUAD[f.away]||[])].filter(id=>!S.picks[0].includes(id)).map(id=>PL[id]);
  if(pool.some(p=>p.starter))pool=pool.filter(p=>p.starter);
  const w={GK:.4,DEF:1,MID:2.2,FWD:3.4,'':1};
  const out=[];while(out.length<2&&pool.length){const c=pool.filter(p=>!out.includes(p.id));const wt=p=>w[p.pos]*(p.form||2);const tot=c.reduce((s,p)=>s+wt(p),0);let r=Math.random()*tot;for(const p of c){r-=wt(p);if(r<=0){out.push(p.id);break}}}
  return out;
}

function pbar(){

function powersSheet(){
  const E=S.eng,now=nowMin(E),lock=inF10(E),ok=inPlay(E)&&!lock;
  const sides=ALL().filter(canControl);
  return sides.map(i=>`<div class="pw"><h3>${esc(pname(i))}</h3><div class="pwrow">${PTYPES.map(type=>{
      const used=S.powers.find(p=>p.owner===i&&p.type===type),P=POWER[type];
      const left=used?used.from+P.dur-now:0,on=used&&left>0;
      const state=used?(on?`Active · ${left}′ left`:'Used'):lock?'Locked in the final 10′':ok?'Tap to use':'Wait for play';
      return `<button class="pwb ${type} ${on?'on':''}" data-pw="${i}:${type}" ${used||!ok?'disabled':''}><b>${P.icon} ${P.label}</b><span>${P.desc}</span><span class="st">${state}</span></button>`}).join('')}</div>
    ${S.pwPick&&S.pwPick.owner===i?`<div class="pwpick"><span>${S.pwPick.type==='double'?'Double the points of which of your players?':'Flip the points of which of their players?'}</span><div class="tlist">${(S.pwPick.type==='double'?[i]:multi()?ALL().filter(j=>j!==i):[1-i]).flatMap(j=>current(j).map(id=>[j,id])).map(([j,id])=>`<button data-pwt="${id}">${shirt(id)}<span><b>${esc(PL[id].name)}</b> <small>${esc(TEAMS[PL[id].team].short)}${multi()&&j!==i?' · '+esc(pname(j)):''}</small></span></button>`).join('')}</div><button class="linkbtn" data-pwx="1">Cancel</button></div>`:''}
  </div>`).join('')+`<p class="small muted" style="margin:0">Each power-up works once per match, and not from the 80th minute. Timing is in match minutes.</p>`;
}
function swapSheet(owner,k){
  const out=current(owner)[k],pool=swapPool(owner);
  return `<p class="small muted" style="margin:0">Take <b>${esc(PL[out].name)}</b> out. Points he already earned stay; the new player only scores from now. One swap per match.</p>
    <div class="tlist">${pool.map(id=>`<button data-swin="${id}">${shirt(id)}<span><b>${esc(PL[id].name)}</b> <small>${PL[id].pos||''} · ${esc(TEAMS[PL[id].team].short)}</small></span></button>`).join('')||'<p class="muted small">No players available.</p>'}</div>`;
}
function openSheet(kind,arg){S.sheet={kind,...(arg||{})};const E=S.eng;if(E&&(E.kind==='sim'||E.replay)&&!S.paused){S.paused=true;S.pwPaused=true}drawSheet()}
function closeSheet(){S.sheet=null;S.pwPick=null;if(S.pwPaused){S.paused=false;S.pwPaused=false}document.getElementById('sheet')?.remove();document.getElementById('scrim')?.remove();if(S.view==='live')updateLive()}
function drawSheet(){
  if(!S.sheet||S.view!=='live'){document.getElementById('sheet')?.remove();document.getElementById('scrim')?.remove();return}
  let sh=document.getElementById('sheet');
  if(!sh){const sc=document.createElement('div');sc.id='scrim';sc.className='scrim';sc.onclick=closeSheet;document.body.appendChild(sc);
    sh=document.createElement('div');sh.id='sheet';sh.className='sheet';sh.setAttribute('role','dialog');document.body.appendChild(sh);
    sh.onclick=ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.close){closeSheet();return}
      if(b.dataset.pw){const [o,tp]=b.dataset.pw.split(':');if(tp==='shield'){activatePower(+o,'shield',null);closeSheet();return}S.pwPick={owner:+o,type:tp};drawSheet();return}
      if(b.dataset.pwt){const pk=S.pwPick;activatePower(pk.owner,pk.type,b.dataset.pwt);buzz(40);closeSheet();return}
      if(b.dataset.pwx){S.pwPick=null;drawSheet();return}
      if(b.dataset.swin){doSwap(S.sheet.owner,S.sheet.k,b.dataset.swin);closeSheet();return}}}
  const sw=S.sheet.kind==='swap';
  sh.innerHTML=`<div class="hd"><h3>${sw?'⇄ Swap a player':'⚡ Power-ups'}</h3><button class="x" data-close="1">Close</button></div>${sw?swapSheet(S.sheet.owner,S.sheet.k):powersSheet()}`;
}

const DARES=['Buys the next kebab','Wears my team\'s shirt tomorrow','Posts the result on their story','Uses a profile photo I choose for 3 days','Buys the drinks next match night','Sings the winner\'s club anthem on video'];

// ================= Power-ups =================
const POWER={double:{dur:10,label:'Double Points',icon:'⚡',desc:'One of your players scores ×2 for 10 min'},neg:{dur:5,label:'Negative Points',icon:'☠',desc:'One of their players scores minus for 5 min'},shield:{dur:15,label:'Shield',icon:'🛡',desc:'Blocks the next Negative Points used on you in the next 15 min'}};
const PTYPES=['double','neg','shield'];
const CAPTAIN=false; // Lukas: no captain for now
function resetPowers(){S.powers=[];S.swaps=[];S.htTot=null;S.f10Seen=false;S.pwPick=null;S.pwFeed=[];const r=(a,b)=>a+Math.floor(Math.random()*(b-a));S.cpuPlan={double:r(12,70),neg:r(15,78),shield:r(10,60)};S.pen=null;S.penSeen=false}
resetPowers();
function nowMin(E){if(E.kind==='sim')return E.cursor+1;if(E.replay&&!E.final)return E.cursor;return E.elapsed||0}
function inPlay(E){
  if(!E||E.done||E.final)return false;
  const c=E.clock();if(c.status==='Half time')return false;
  if(E.kind==='sim')return E.cursor>=0;
  if(!E.data)return false;
  return E.replay?E.cursor>0:LIVE.has(E.status)&&E.status!=='HT'&&E.status!=='P';
}
function activePowers(){const E=S.eng;if(!E||E.final)return [];const now=nowMin(E);
  return S.powers.map(p=>({p,left:p.from+POWER[p.type].dur-now})).filter(x=>x.left>0)}
function activatePower(owner,type,target){
  const E=S.eng;if(!inPlay(E)||inF10(E)||S.powers.some(p=>p.owner===owner&&p.type===type))return;
  const shown=E.shown();const from=nowMin(E);
  const ord=Math.max(from,...shown.map(e=>e.ord||0),...S.powers.map(p=>p.ord||0))+0.0001;
  const pw={owner,type,target:type==='shield'?null:target,from,ord,lbl:E.clock().min,seen:shown.map(e=>e.ord)};
  S.powers.push(pw);rebuildPwFeed();fx('power',{type,owner,target:pw.target});
  if(S.mode==='online'){onlinePost({action:'power',type,target:pw.target,from,ord,lbl:pw.lbl,seen:pw.seen}).catch(e=>{S.powers=S.powers.filter(x=>x!==pw);rebuildPwFeed();toast(e.message);updateLive()})}
  else if(E.kind==='real'&&!E.replay)saveActive();
}
function rebuildPwFeed(){const blk=blockedNegs();S.pwFeed=[...S.powers.map(p=>({ord:p.ord,el:p.from,lbl:p.lbl,type:'power',owner:p.owner,ptype:p.type,player:p.target,blocked:blk.has(p),team:PL[p.target]?PL[p.target].team:'',pts:{}})),
  ...S.swaps.map(w=>({ord:w.ord,el:w.from,lbl:w.lbl,type:'swap',owner:w.owner,player:w.in,out:w.out,team:PL[w.in]?PL[w.in].team:'',pts:{}}))]}
// A Shield blocks the first Negative Points the rival uses on you within 15 minutes of turning it on
function blockedNegs(){const out=new Set(),used=new Set();
  S.powers.filter(p=>p.type==='neg').sort((a,b)=>a.ord-b.ord).forEach(n=>{
    const vic=multi()?holderOf(n.target):1-n.owner;
    const sh=S.powers.find(s=>s.type==='shield'&&s.owner!==n.owner&&s.owner===vic&&!used.has(s)&&s.ord<n.ord&&n.from<s.from+POWER.shield.dur);
    if(sh){used.add(sh);out.add(n)}});
  out.shields=used;return out}
function powerAdjust(){
  const E=S.eng,adj=ALL().map(()=>({})),per=S.powers.map(()=>0);
  if(!E||!S.powers.length)return {adj,per};
  const blk=blockedNegs();
  E.shown().filter(e=>!e.spread&&e.el!=null).forEach(e=>{for(const id in e.pts){const v=e.pts[id];if(!v)continue;
    ALL().forEach(side=>{
      const act=S.powers.map((p,k)=>[p,k]).filter(([p])=>p.target===id&&!blk.has(p)&&(p.type==='double'?p.owner===side:p.owner!==side)&&e.el>=p.from&&e.el<p.from+POWER[p.type].dur&&!p.seen.includes(e.ord));
      if(!act.length)return;
      let val=v;const dbl=act.find(([p])=>p.type==='double'),neg=act.find(([p])=>p.type==='neg');
      if(dbl){val=v*2;per[dbl[1]]+=v}
      if(neg&&val>0){per[neg[1]]-=2*val;val=-val}
      adj[side][id]=(adj[side][id]||0)+val-v;
    })}});
  // Replays get full-match stats only at the end, so spread them evenly over the minutes the player was on the pitch
  if(E.kind==='real'&&E.replay&&E.final){
    S.powers.forEach((p,k)=>{if(!p.target||blk.has(p))return;const st=E.stats[p.target];if(!st||!st.minutes)return;const sp=statPoints(st);if(!sp)return;
      const sub=E.events.find(e=>e.type==='sub'&&(e.assist===p.target||e.player===p.target));
      const start=sub&&Math.abs((90-sub.el)-st.minutes)<Math.abs(sub.el-st.minutes)?sub.el:0,end=start+st.minutes;
      const ov=Math.max(0,Math.min(end,p.from+POWER[p.type].dur)-Math.max(start,p.from));if(!ov)return;
      const v=Math.round(sp*ov/st.minutes);
      const d=p.type==='double'?v:(v>0?-2*v:0);if(!d)return;
      const side=p.type==='double'?p.owner:multi()?holderOf(p.target):1-p.owner;if(side==null)return;per[k]+=d;adj[side][p.target]=(adj[side][p.target]||0)+d});
  }
  return {adj,per};
}
function cpuPowers(){
  const E=S.eng;if(S.mode!=='cpu'||!inPlay(E))return;const now=nowMin(E);
  PTYPES.forEach(type=>{
    if(S.powers.some(p=>p.owner===1&&p.type===type)||now<S.cpuPlan[type])return;
    if(type==='shield'){activatePower(1,'shield',null);return}
    const pool=current(type==='double'?1:0).filter(id=>!E.sentOff.has(id));if(!pool.length)return;
    const w={FWD:3,MID:2,DEF:1,GK:.5,'':1};const t=pickWeighted(pool.map(id=>PL[id]),p=>w[p.pos]||1);
    activatePower(1,type,t.id);
  });
}
// ================= Final 10' =================
// From the 80th minute every point counts double, and no power-up can be started any more.
const F10=80;
const matchMin=e=>e.min!=null?e.min:(e.el||0);
function nowMatchMin(E){if(!E)return 0;if(E.kind==='sim')return E.minAt(Math.max(0,E.cursor));return nowMin(E)}
function inF10(E){return E&&!E.final&&nowMatchMin(E)>=F10&&inPlay(E)}
function f10Bonus(i){const E=S.eng;if(!E||!E.shown)return 0;let v=0;
  E.shown().forEach(e=>{if(e.type==='power'||e.type==='swap')return;const p=sideEvPts(i,e);if(!p)return;
    if(e.spread){v+=Math.round(p*Math.max(0,(E.maxMin||90)-F10)/(E.maxMin||90))}else if(matchMin(e)>=F10)v+=p});
  return v}

// ================= Half-time penalty shootout =================
// At half-time both players can take a penalty shootout (penalty.html in a full-screen frame).
// The winner scores ×2 for 5 minutes at the start of the 2nd half (46′ to 50′), so it never overlaps the Final 10′.
// Against the computer or on one phone: a normal shootout. Online: each phone takes 5 kicks against the computer keeper,
// more goals wins. If one player doesn't play within 2 minutes, the other wins (online: 2 minutes after the first one played).
const PEN_MS=120000,PEN_FROM=46,PEN_DUR=5;
function atHT(E){if(!E||E.final)return false;if(E.kind==='sim')return E.cursor===E.htIdx&&E.htWait>0;if(E.replay)return E.cursor===45&&E.htWait>0;return E.status==='HT'}
function in2H(E){if(!E)return false;if(E.kind==='sim')return E.cursor>E.htIdx;return nowMin(E)>=46&&!atHT(E)}
function penOnline(){return S.mode==='online'&&S.online&&S.online.state?S.online.state.pen||null:null}
function penWin(){if(S.mode==='online'){const p=penOnline();return p&&p.done?p.winner:null}return S.pen&&S.pen.res?S.pen.res.winner:null}
function penDone(){if(S.mode==='online'){const p=penOnline();return !!(p&&p.done)}return !!(S.pen&&S.pen.res)}
function boostOn(E){const w=penWin();return w!=null&&!!E&&!E.final&&in2H(E)&&nowMatchMin(E)<PEN_FROM+PEN_DUR}
const inBoost=e=>!e.spread&&(e.half==null||e.half===2)&&matchMin(e)>=PEN_FROM&&matchMin(e)<PEN_FROM+PEN_DUR&&matchMin(e)<F10;
function evMult(i,e){if(!e.spread&&matchMin(e)>=F10)return 2;return penWin()===i&&inBoost(e)?2:1}
function penBonus(i){if(penWin()!==i)return 0;const E=S.eng;if(!E||!E.shown)return 0;let v=0;
  E.shown().forEach(e=>{if(e.type==='power'||e.type==='swap')return;const p=sideEvPts(i,e);if(!p)return;
    if(e.spread)v+=Math.round(p*PEN_DUR/(E.maxMin||90));else if(inBoost(e))v+=p});
  return v}
// Sim / replay: the clock waits at half-time while the shootout is open (2 minutes at most)
function penHold(E){return S.mode!=='online'&&atHT(E)&&!!S.pen&&!S.pen.res}
// Open the offer at half-time, and settle it when the 2 minutes run out
function penTick(){const E=S.eng;if(!E||multi())return; // penalty shootout: 2-player duels only
  if(S.mode==='online'){const p=penOnline();if(p&&p.done&&!S.penSeen){S.penSeen=true;if(p.winner!=null){sfx('whistle');toast(`⚽ ${pname(p.winner)} won the penalty shootout: ×2 for 5 min`)}}return}
  if(!S.pen&&atHT(E)){S.pen={at:Date.now(),res:null};sfx('whistle');saveActive()}
  if(S.pen&&!S.pen.res&&Date.now()-S.pen.at>=PEN_MS){S.pen.res={winner:S.mode==='cpu'?1:null,late:true};closePen();saveActive();if(S.mode==='cpu')toast('⏱ Too late: the computer wins the penalty shootout')}
}
function penLeft(){if(S.mode==='online'){const p=penOnline();return p&&p.left!=null&&p.played&&(p.played[0]||p.played[1])?Math.max(0,p.left-(Date.now()-(S.online.penAt||Date.now()))):null}
  return S.pen&&!S.pen.res?Math.max(0,PEN_MS-(Date.now()-S.pen.at)):null}
const mmss=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function penBanner(){const E=S.eng;if(!E)return '';
  if(boostOn(E)){const w=penWin(),left=PEN_FROM+PEN_DUR-nowMatchMin(E);return `<div class="boost" data-noi18n>⚽ ${esc(pname(w)).toUpperCase()} ×2 · ${left}′</div>`}
  const me=S.mode==='online'&&S.online?S.online.slot:0;
  if(S.mode==='online'){const p=penOnline();if(!(atHT(E)||(p&&!p.done)))return '';
    if(p&&p.done)return atHT(E)?`<div class="pen"><b>⚽ Penalty shootout</b><span>${p.winner==null?'Draw: no ×2 this time.':`<b data-noi18n>${esc(pname(p.winner))}</b> <span>wins ×2 for 5 min at the start of the 2nd half</span>`}</span><span class="small muted" data-noi18n>${p.goals[0]} – ${p.goals[1]}</span></div>`:'';
    if(p&&p.played[me]){const l=penLeft();return `<div class="pen"><b>⚽ Penalty shootout</b><span>Your goals: <b data-noi18n>${p.goals[me]}/5</b></span><span class="small muted">Waiting for your opponent…</span>${l!=null?`<span class="cd" data-noi18n id="pencd">${mmss(l)}</span>`:''}</div>`}
    const l=penLeft();
    return `<div class="pen"><b>⚽ Half-time penalty shootout</b><span class="small">5 kicks against the keeper. Whoever scores more gets ×2 for 5 min at the start of the 2nd half.</span>${l!=null?'<span class="small muted">Your opponent has played. You have 2 minutes.</span>':''}<div class="row"><button class="btn" id="penplay" style="flex:1">Take the penalties</button>${l!=null?`<span class="cd" data-noi18n id="pencd">${mmss(l)}</span>`:''}</div></div>`}
  if(!S.pen||!atHT(E))return '';
  if(S.pen.res){const w=S.pen.res.winner;return `<div class="pen"><b>⚽ Penalty shootout</b><span>${w==null?'No shootout this time.':`<b data-noi18n>${esc(pname(w))}</b> <span>wins ×2 for 5 min at the start of the 2nd half</span>`}</span></div>`}
  const l=penLeft();
  return `<div class="pen"><b>⚽ Half-time penalty shootout</b><span class="small">${S.mode==='cpu'?'Beat the computer to get ×2 for 5 min at the start of the 2nd half. If you don\'t play within 2 minutes, the computer wins.':'Both players, on this phone. The winner gets ×2 for 5 min at the start of the 2nd half.'}</span><div class="row"><button class="btn" id="penplay" style="flex:1">Take the penalties</button><span class="cd" data-noi18n id="pencd">${mmss(l)}</span></div></div>`}
function bindPen(){const b=document.getElementById('penplay');if(b)b.onclick=openPen;

// ================= Slots: who scores for each side over time =================
// Each side has 2 slots. A slot changes hands when its player is subbed off (the player coming on takes over)
// or when its owner uses the one swap per game. Each spell in a slot is a "seg".
function segsOf(i){
  const E=S.eng,segs=S.picks[i].map((id,k)=>({id,k,how:'pick'})),cur=segs.slice();
  if(!E||!E.shown)return segs;
  const shown=E.shown();
  const onPitch=new Set(Object.values(PL).filter(p=>p.starter).map(p=>p.id));const known=onPitch.size>0;
  const changes=[...shown.filter(e=>e.type==='sub').map(e=>({ord:e.ord,sub:e})),...(S.swaps||[]).filter(w=>w.owner===i).map(w=>({ord:w.ord,sw:w}))].sort((a,b)=>a.ord-b.ord);
  changes.forEach(c=>{
    if(c.sub){const e=c.sub;if(!e.player||!e.assist)return;
      // Who went off? API-Football normally lists the player going off first; the lineup confirms it when known.
      let out=e.player,inn=e.assist;if(known&&!onPitch.has(out)&&onPitch.has(inn)){out=e.assist;inn=e.player}
      onPitch.delete(out);onPitch.add(inn);
      const k=cur.findIndex(x=>x.id===out);if(k<0||cur.some(x=>x.id===inn))return;
      const old=cur[k];old.to=e.lbl;old.endHow='sub';const n={id:inn,k,how:'sub',fromLbl:e.lbl,prev:old.id};segs.push(n);cur[k]=n}
    else{const w=c.sw,old=cur[w.k];if(!old||old.id!==w.out)return;
      old.to=w.lbl;old.endHow='swap';old.endKeys=new Set(w.keys);old.endSnap=w.snapOut;old.swapAt=w.from;
      const n={id:w.in,k:w.k,how:'swap',fromLbl:w.lbl,prev:old.id,startKeys:new Set(w.keys),startSnap:w.snapIn,swapAt:w.from};segs.push(n);cur[w.k]=n}
  });
  return segs;
}
function current(i){const segs=segsOf(i);return [0,1].map(k=>segs.filter(x=>x.k===k).pop()).filter(Boolean).map(x=>x.id)}
const segHas=(g,e)=>(!g.startKeys||!g.startKeys.has(evKey(e)))&&(!g.endKeys||g.endKeys.has(evKey(e)));
function segPts(g,t){
  const E=S.eng;if(!g.startKeys&&!g.endKeys)return t.pp[g.id]||0;
  let v=0;E.shown().forEach(e=>{if(e.type!=='stats'&&e.pts[g.id]&&segHas(g,e))v+=e.pts[g.id]});
  if(E.kind==='real'){
    if(!E.replay)v+=statPoints(statDiff(g.endSnap||E.stats[g.id]||{},g.startSnap||null));
    else if(E.final&&E.stats[g.id]){const fr=Math.min(1,(g.swapAt||0)/Math.max(90,E.maxMin));v+=Math.round(statPoints(E.stats[g.id])*(g.endKeys?fr:1-fr))}
  }
  return v;
}
// Score for one side: every spell in its slots, power-ups, and the captain bonus (captain slot counts ×1.5)
function sideScore(i,t,a){
  t=t||S.eng.tally();a=a||powerAdjust();
  const rows=segsOf(i).map(g=>({...g,pts:segPts(g,t)}));
  const ids=[...new Set(rows.map(r=>r.id))];
  const adjOf=id=>a.adj[i][id]||0;
  let total=rows.reduce((x,r)=>x+r.pts,0)+ids.reduce((x,id)=>x+adjOf(id),0);
  const ck=CAPTAIN&&S.capt?S.capt[i]:null;let cap=0;
  if(ck!=null){const cs=rows.filter(r=>r.k===ck);const base=cs.reduce((x,r)=>x+r.pts,0)+[...new Set(cs.map(r=>r.id))].reduce((x,id)=>x+adjOf(id),0);cap=Math.round(base*0.5)}
  const f10=f10Bonus(i),pen=penBonus(i);
  return {rows,adjOf,cap,f10,pen,total:total+cap+f10+pen};
}
function sideEvPts(i,e){if(!e.pts)return 0;return segsOf(i).reduce((x,g)=>x+(e.pts[g.id]&&segHas(g,e)?e.pts[g.id]:0),0)}
function swapUsed(i){return (S.swaps||[]).some(w=>w.owner===i)}
function doSwap(owner,k,inId){
  const E=S.eng;if(!inPlay(E)||swapUsed(owner))return;
  const out=current(owner)[k];if(!out||out===inId)return;
  const shown=E.shown();const from=nowMin(E);
  const ord=Math.max(from,...shown.map(e=>e.ord||0),...S.powers.map(p=>p.ord||0))+0.0002;
  const cp=o=>o?{...o}:{};
  const w={owner,type:'swap',k,out,in:inId,from,ord,lbl:E.clock().min,keys:shown.filter(e=>e.type!=='stats').map(evKey),snapOut:cp(E.stats&&E.stats[out]),snapIn:cp(E.stats&&E.stats[inId])};
  S.swaps.push(w);rebuildPwFeed();
  if(S.mode==='online'){const pl=PL[inId];onlinePost({action:'power',type:'swap',k,out,in:inId,from,ord,lbl:w.lbl,keys:w.keys,snapOut:w.snapOut,snapIn:w.snapIn,pl:{team:pl.team,name:pl.name,pos:pl.pos,num:pl.num!=null?String(pl.num):''}})
    .catch(e=>{S.swaps=S.swaps.filter(x=>x!==w);rebuildPwFeed();toast(e.message);updateLive()})}
  else if(E.kind==='real'&&!E.replay)saveActive();
}
// Players who can come in with a swap: on the pitch right now when lineups are known
function swapPool(owner){
  const f=S.fixture,E=S.eng,mine=new Set(current(owner));
  const all=[...(SQUAD[f.home]||[]),...(SQUAD[f.away]||[])].filter(id=>!mine.has(id)&&!(E.sentOff&&E.sentOff.has(id)));
  const starters=new Set(all.filter(id=>PL[id].starter));
  const ord={FWD:0,MID:1,DEF:2,GK:3,'':4},sorted=l=>l.sort((a,b)=>(PL[a].team===PL[b].team?0:PL[a].team===f.home?-1:1)||(ord[PL[a].pos]??4)-(ord[PL[b].pos]??4));
  if(!starters.size)return sorted(all);
  const on=new Set(Object.values(PL).filter(p=>p.starter).map(p=>p.id));
  E.shown().filter(e=>e.type==='sub').forEach(e=>{let o=e.player,n=e.assist;if(!on.has(o)&&on.has(n)){o=e.assist;n=e.player}on.delete(o);if(n)on.add(n)});
  return sorted(all.filter(id=>on.has(id)));
}

// ================= Online duels (two phones) =================
const shareUrl=code=>location.origin+location.pathname+'#duel-'+code;
async function onlineFetch(opts){
  let r,b;
  try{r=await fetch('/api/duel'+(opts.get?'?'+new URLSearchParams(opts.get):''),opts.body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(opts.body)}:{});b=await r.json()}
  catch(e){throw new Error('No connection. Check your internet and try again.')}
  if(!r.ok||b.error)throw new Error(b.error||'Something went wrong.');
  return b;
}
async function onlinePost(body){
  const o=S.online;const b=await onlineFetch({body:{...body,code:o.code,token:o.token}});
  applyOnline(b.state);return b;
}
function applyOnline(st){
  if(!st)return;S.online.state=st;S.online.penAt=Date.now();gotChat(st.chat||[]);
  Object.entries(st.teams||{}).forEach(([k,t])=>{if(!TEAMS[k])TEAMS[k]=t});
  S.names=st.players.map((p,i)=>(p&&p.name)||(i===0?'Player 1':i===1?'':'Player '+(i+1)));
  st.players.forEach(p=>p&&(p.players||[]).forEach(x=>{if(!PL[x.id])PL[x.id]=x}));
  if(st.draft){st.draft.picks.forEach(x=>{if(!PL[x.id]&&x.pl)PL[x.id]=x.pl});if(!st.both)S.picks=st.players.map((_,i)=>i).map(i=>st.draft.picks.filter(x=>x.s===i).map(x=>x.id))}
  if(st.both){
    S.picks=st.players.map(p=>p.picks);
    S.dares=st.players.map(p=>p.dare||'');S.dareOk=st.players.map(p=>p.dareOk);
    S.capt=st.players.map(p=>p.capt||0);
    const all=st.powers||[];S.powers=all.filter(p=>p.type!=='swap');S.swaps=all.filter(p=>p.type==='swap');
    S.swaps.forEach(w=>{if(w.pl&&!PL[w.in])PL[w.in]=w.pl});rebuildPwFeed();
  }
}
function startSync(ms){
  if(S.syncT)clearInterval(S.syncT);

async function syncOnce(){

    else if(S.view==='draft'&&st.draft){if(st.both){go('reveal');startSync(5000)}else viewDraft()}
    else if(S.view==='wait'){if(st.both)go('reveal');else viewWait()}

}

// ================= Engines =================
// Common event: {lbl, ord, type, team, player, assist, pts:{id:n}, text?}
function pickWeighted(list,wf){const tot=list.reduce((s,p)=>s+wf(p),0);let r=Math.random()*tot;for(const p of list){r-=wf(p);if(r<=0)return p}return list[list.length-1]}

// ---- Practice simulation ----
function simEngine(f){
  const st1=1+Math.floor(Math.random()*3),st2=2+Math.floor(Math.random()*4);
  const minutes=[];for(let m=1;m<=45+st1;m++)minutes.push({half:1,m});for(let m=46;m<=90+st2;m++)minutes.push({half:2,m});
  const label=(h,m)=>h===1&&m>45?`45+${m-45}′`:h===2&&m>90?`90+${m-90}′`:`${m}′`;
  const yellows=new Set(),sentOff=new Set();const events=[];const pending=[];
  const P=t=>SQUAD[t].map(id=>PL[id]);
  const gW={GK:.03,DEF:.7,MID:2.2,FWD:4.6},aW={GK:.15,DEF:1.4,MID:4,FWD:2.4},yW={GK:.4,DEF:3.2,MID:2.4,FWD:1.3};
  minutes.forEach((t,idx)=>{
    const lbl=label(t.half,t.m);
    pending.filter(p=>p.at===idx).forEach(p=>{const g=p.goal;const pts={};for(const k in g.pts)pts[k]=-g.pts[k];events.push({idx,lbl,type:'var',team:g.team,player:g.player,ref:g,pts})});
    const r=Math.random();
    if(r<0.045){
      const team=Math.random()<0.53?f.home:f.away;const opp=team===f.home?f.away:f.home;
      if(Math.random()<0.04){const pl=pickWeighted(P(opp).filter(p=>!sentOff.has(p.id)&&p.pos==='DEF'),()=>1);events.push({idx,lbl,type:'og',team,player:pl.id,pts:{}});return}
      const avail=P(team).filter(p=>!sentOff.has(p.id));
      const sc=pickWeighted(avail,p=>gW[p.pos]*(0.6+p.form*0.3));
      let as=null;if(Math.random()<0.78){const c=avail.filter(p=>p.id!==sc.id);if(c.length)as=pickWeighted(c,p=>aW[p.pos]*(0.6+p.form*0.3))}
      const pts={[sc.id]:POINTS.goal};if(as)pts[as.id]=POINTS.assist;
      const ev={idx,lbl,type:'goal',team,player:sc.id,assist:as&&as.id,pts};events.push(ev);
      if(Math.random()<0.08){const at=Math.min(minutes.length-1,idx+1+Math.floor(Math.random()*2));if(at>idx)pending.push({at,goal:ev})}
    }else if(r<0.097){
      const team=Math.random()<.5?f.home:f.away;
      const pl=pickWeighted(P(team).filter(p=>!sentOff.has(p.id)),p=>yW[p.pos]);
      if(yellows.has(pl.id)){sentOff.add(pl.id);events.push({idx,lbl,type:'second',team,player:pl.id,pts:{[pl.id]:POINTS.second}})}
      else{yellows.add(pl.id);events.push({idx,lbl,type:'yellow',team,player:pl.id,pts:{[pl.id]:POINTS.yellow}})}
    }else if(r<0.0992){
      const team=Math.random()<.5?f.home:f.away;
      const pl=pickWeighted(P(team).filter(p=>!sentOff.has(p.id)&&p.pos!=='GK'),p=>yW[p.pos]);
      sentOff.add(pl.id);events.push({idx,lbl,type:'red',team,player:pl.id,pts:{[pl.id]:POINTS.red}});
    }
  });
  events.forEach((e,i)=>{e.el=e.idx+1;e.ord=e.idx+1+i/10000;const mm=minutes[e.idx];if(mm){e.min=mm.m;e.half=mm.half}});
  const E={kind:'sim',cursor:-1,htWait:0,htIdx:45+st1-1,done:false,sentOff:new Set(),minAt:i=>minutes[i]?minutes[i].m:90,
    shown(){return events.filter(e=>e.idx<=E.cursor)},
    clock(){const ht=E.cursor===45+st1-1&&E.htWait>0;return {min:E.cursor<0?'0′':minutes[E.cursor]?label(minutes[E.cursor].half,minutes[E.cursor].m):'FT',status:S.paused?'Paused':ht?'Half time':E.cursor<0?'Kickoff':E.cursor<=45+st1-1?'1st half':'2nd half',live:!S.paused&&!ht}},
    tally(){const pp={};let hs=0,as=0;E.shown().forEach(e=>{for(const k in e.pts)pp[k]=(pp[k]||0)+e.pts[k];if(e.type==='goal'||e.type==='og'){e.team===f.home?hs++:as++}if(e.type==='var'){e.team===f.home?hs--:as--}});return {pp,hs,as}},
    why(id){return events.filter(e=>e.pts[id]).map(e=>`${e.lbl} ${evWord(e,id)} ${sign(e.pts[id])}`)},
    tick(){
      if(E.cursor===45+st1-1&&E.htWait<3){E.htWait++;return}
      if(E.cursor>=minutes.length-1){E.finish();return}
      E.cursor++;E.shown().filter(e=>e.idx===E.cursor&&(e.type==='second'||e.type==='red')).forEach(e=>E.sentOff.add(e.player));
    },
    finish(){E.cursor=minutes.length-1;E.done=true;E.sentOff=new Set(sentOff);E.final=true},
    stop(){}
  };
  return E;
}
const sign=v=>(v>0?'+':'−')+Math.abs(v);
function evWord(e,id){return e.type==='goal'?(e.player===id?'goal':'assist'):e.type==='var'?'VAR cancel':e.type==='second'?'2nd yellow':e.type==='stats'?'stats':e.type}

// ---- Real match (live polling or replay of a finished match) ----
function statsOf(raw){const s=(raw&&raw[0])||{};const n=v=>{const x=parseInt(v,10);return isNaN(x)?0:x};
  // API-Football gives passes.accuracy as the number of accurate passes for a single match (checked on a live match).
  // If it ever comes back as a percentage, convert using the total.
  const tot=n(s.passes&&s.passes.total);let acc=n(s.passes&&s.passes.accuracy);
  if(typeof (s.passes&&s.passes.accuracy)==='string'&&String(s.passes.accuracy).includes('%'))acc=Math.round(tot*acc/100);
  return {goals:n(s.goals&&s.goals.total),assists:n(s.goals&&s.goals.assists),yellow:n(s.cards&&s.cards.yellow),red:n(s.cards&&s.cards.red),
    tackles:n(s.tackles&&s.tackles.total),interceptions:n(s.tackles&&s.tackles.interceptions),shotsOn:n(s.shots&&s.shots.on),shotsOff:Math.max(0,n(s.shots&&s.shots.total)-n(s.shots&&s.shots.on)),
    keyPasses:n(s.passes&&s.passes.key),dribbles:n(s.dribbles&&s.dribbles.success),duelsWon:n(s.duels&&s.duels.won),foulsDrawn:n(s.fouls&&s.fouls.drawn),
    penWon:n(s.penalty&&s.penalty.won),penMissed:n(s.penalty&&s.penalty.missed),penSaved:n(s.penalty&&s.penalty.saved),
    saves:n(s.goals&&s.goals.saves),fouls:n(s.fouls&&s.fouls.committed),passes:Math.min(acc,tot||acc),passFail:Math.max(0,tot-acc),minutes:n(s.games&&s.games.minutes)}}
function statParts(st){return STATDEF.map(([k,one,many,p])=>[(st[k]||0)===1?one:many,st[k]||0,(st[k]||0)*p]).filter(x=>x[1])}
const statPoints=st=>statParts(st).reduce((s,x)=>s+x[2],0);
function eventPointsFromTotals(st){return st.goals*POINTS.goal+st.assists*POINTS.assist+(st.red?POINTS.red:st.yellow*POINTS.yellow)}

function parseEvents(raw,f){
  const out=[];const lastGoalBy={};
  (raw||[]).forEach((e,i)=>{
    const el=(e.time&&e.time.elapsed)||0,ex=(e.time&&e.time.extra)||0;
    const lbl=ex?`${el}+${ex}′`:`${el}′`;const ord=el+ex/100+i/100000;
    const team=teamKey(e.team);const pid=regPlayer(e.player,team);const aid=regPlayer(e.assist,team);
    const type=String(e.type||'').toLowerCase(),det=String(e.detail||'');
    if(type==='goal'){
      if(/missed/i.test(det))out.push({ord,el,lbl,type:'miss',team,player:pid,pts:{}});
      else if(/own/i.test(det))out.push({ord,el,lbl,type:'og',team,player:pid,pts:{}});
      else{const pts={};if(pid)pts[pid]=POINTS.goal;if(aid)pts[aid]=POINTS.assist;const ev={ord,el,lbl,type:'goal',team,player:pid,assist:aid,pts,pen:/penalty/i.test(det)};out.push(ev);if(pid)lastGoalBy[pid]=ev}
    }else if(type==='card'){
      if(/second/i.test(det))out.push({ord,el,lbl,type:'second',team,player:pid,pts:pid?{[pid]:POINTS.second}:{}});
      else if(/red/i.test(det))out.push({ord,el,lbl,type:'red',team,player:pid,pts:pid?{[pid]:POINTS.red}:{}});
      else out.push({ord,el,lbl,type:'yellow',team,player:pid,pts:pid?{[pid]:POINTS.yellow}:{}});
    }else if(type==='var'){
      if(/goal (cancelled|disallowed)/i.test(det)&&pid&&lastGoalBy[pid]&&!lastGoalBy[pid].voided){const g=lastGoalBy[pid];g.voided=true;const pts={};for(const k in g.pts)pts[k]=-g.pts[k];out.push({ord,el,lbl,type:'var',team,player:pid,ref:g,pts})}
      else out.push({ord,el,lbl,type:'varinfo',team,player:pid,text:det,pts:{}});
    }else if(type==='subst'){

    }

}

// Joining a match already in progress: only what happens from that moment counts.
// The duel's start = {el, keys (events already shown), base (picked players' stats at that moment)}.
const evKey=e=>e.type+'|'+(e.player||'')+'|'+e.lbl;
function statDiff(cur,base){if(!base)return cur;const o={};for(const k in cur)o[k]=Math.max(0,(cur[k]||0)-(base[k]||0));if(cur.red&&base.red)o.red=0;return o}
function realEngine(f,replay,start){
  const picked=()=>new Set([...S.picks[0],...S.picks[1]]);
  const E={kind:'real',replay,kick:replay?null:(start||null),data:null,events:[],stats:{},prevStat:{},statFeed:[],cursor:replay?0:null,maxMin:90,done:false,final:false,
    sentOff:new Set(),lastFetch:null,err:null,pollT:null,status:f.status,elapsed:f.elapsed,goals:f.goals||{home:0,away:0},
    async fetch(){
      try{
        const r=await api('fixtures',{id:f.apiId,timezone:TZ});const x=r[0];if(!x)throw new Error('This match was not found.');
        E.data=x;E.err=null;E.lastFetch=Date.now();
        E.status=x.fixture.status.short;E.elapsed=x.fixture.status.elapsed;E.goals=x.goals;f.status=E.status;f.elapsed=E.elapsed;f.goals=x.goals;
        let evs=parseEvents(x.events,f);
        const raw={};(x.players||[]).forEach(t=>{const k=teamKey(t.team);(t.players||[]).forEach(pp=>{const id=regPlayer(pp.player,k);if(id)raw[id]=statsOf(pp.statistics)})});
        if(!E.replay&&!E.kick)await E.setStart({el:LIVE.has(E.status)||FINAL.has(E.status)?(E.elapsed||0):0,keys:evs.map(evKey),base:Object.fromEntries([...picked()].filter(id=>raw[id]).map(id=>[id,raw[id]]))});
        if(E.kick){const skip=new Set(E.kick.keys||[]);evs=evs.filter(e=>!skip.has(evKey(e))&&!(e.type==='var'&&e.ref&&skip.has(evKey(e.ref))))}
        E.events=evs;
        const st={};for(const id in raw)st[id]=E.kick?statDiff(raw[id],E.kick.base&&E.kick.base[id]):raw[id];
        E.stats=st;
        E.maxMin=Math.max(90,...E.events.map(e=>e.el+1));
        if(!E.replay){
          // Feed items for stat changes of picked players since the last update
          const now=E.elapsed?E.elapsed+'′':'';
          picked().forEach(id=>{if(!st[id])return;const before=E.prevStat[id];const cur=statPoints(st[id]);
            if(before&&cur!==before.pts){const parts=STATDEF.map(([k,one,many])=>{const d=(st[id][k]||0)-(before.st[k]||0);return d?`${d>0?'+':''}${d} ${Math.abs(d)===1?one:many}`:''}).filter(Boolean);
              E.statFeed.push({ord:(E.elapsed||0)+0.99,el:E.elapsed||0,lbl:now,type:'stats',team:PL[id].team,player:id,text:parts.join(', '),pts:{[id]:cur-before.pts}})}
            E.prevStat[id]={pts:cur,st:st[id]}});
          if(FINAL.has(E.status)){E.done=true;E.final=true}
        }
        E.sentOff=new Set(E.shown().filter(e=>e.type==='red'||e.type==='second').map(e=>e.player));
      }catch(e){E.err=e.message}
    },
    async setStart(cand){
      E.kick=cand;
      if(S.mode==='online'&&S.online){try{await onlinePost({action:'start',start:cand});if(S.online.state&&S.online.state.start)E.kick=S.online.state.start}catch(e){}}
      else saveActive();
    },
    shown(){
      if(E.replay&&!E.final)return E.events.filter(e=>e.el<=E.cursor);
      return [...E.events,...E.statFeed].sort((a,b)=>a.ord-b.ord);
    },
    tally(){
      const pp={};
      if(E.final&&Object.keys(E.stats).length){
        // Full-time reconciliation from official player totals
        E.events.forEach(e=>{for(const k in e.pts)pp[k]=(pp[k]||0)+e.pts[k]}); // fallback for players without stats
        for(const id in E.stats){pp[id]=eventPointsFromTotals(E.stats[id])+statPoints(E.stats[id])}
      }else{
        E.shown().filter(e=>e.type!=='stats').forEach(e=>{for(const k in e.pts)pp[k]=(pp[k]||0)+e.pts[k]});
        if(!E.replay)for(const id in E.stats)pp[id]=(pp[id]||0)+statPoints(E.stats[id]);
      }
      let hs,as;
      if(E.replay&&!E.final){hs=0;as=0;E.shown().forEach(e=>{if(e.type==='goal'||e.type==='og')e.team===f.home?hs++:as++;if(e.type==='var')e.team===f.home?hs--:as--})}
      else{hs=E.goals.home??0;as=E.goals.away??0}
      return {pp,hs,as};
    },
    why(id){
      const st=E.stats[id];if(!st)return E.events.filter(e=>e.pts[id]).map(e=>`${e.lbl} ${evWord(e,id)} ${sign(e.pts[id])}`);
      const out=[];if(st.goals)out.push(`${st.goals} goal${st.goals>1?'s':''} ${sign(st.goals*POINTS.goal)}`);
      if(st.assists)out.push(`${st.assists} assist${st.assists>1?'s':''} ${sign(st.assists*POINTS.assist)}`);
      if(st.red)out.push(`red card ${sign(POINTS.red)}`);else if(st.yellow)out.push(`yellow card ${sign(POINTS.yellow)}`);
      statParts(st).forEach(([n,v,p])=>out.push(`${v} ${n}${p?' '+sign(p):''}`));
      if(!st.minutes&&!out.length)out.push('Did not play');
      return out;
    },
    clock(){
      if(E.replay&&!E.final)return {min:E.cursor+'′',status:S.paused?'Paused':E.cursor===45&&E.htWait>0?'Half time':'Replay',live:!S.paused};
      const st=E.status;
      const status=LIVE.has(st)?(st==='HT'?'Half time':st==='ET'?'Extra time':st==='P'?'Penalties':'Live'):FINAL.has(st)?'Full time':st==='NS'||st==='TBD'?'Not started':st;
      return {min:LIVE.has(st)?(st==='HT'?'HT':(E.elapsed||0)+'′'):FINAL.has(st)?'FT':new Date(f.kickoff).toLocaleTimeString(LOC(), {hour:'2-digit',minute:'2-digit'}),status,live:LIVE.has(st)&&st!=='HT'};
    },
    htWait:0,
    tick(){ // replay only
      if(E.cursor===45&&E.htWait<2){E.htWait++;return}
      if(E.cursor>=E.maxMin){E.finish();return}
      E.cursor++;E.sentOff=new Set(E.shown().filter(e=>e.type==='red'||e.type==='second').map(e=>e.player));
    },
    finish(){
      E.final=true;E.done=true;E.cursor=E.maxMin;
      if(E.replay){picked().forEach(id=>{const st=E.stats[id];if(!st)return;const parts=statParts(st);if(parts.length)E.statFeed.push({ord:999,el:E.maxMin,spread:true,lbl:'FT',type:'stats',team:PL[id].team,player:id,text:'Full-match stats: '+parts.map(([n,v])=>`${v} ${n}`).join(', '),pts:{[id]:statPoints(st)}})})}
      E.sentOff=new Set(E.events.filter(e=>e.type==='red'||e.type==='second').map(e=>e.player));
    },
    async start(){
      await E.fetch();if(S.view==='live')updateLive();
      if(E.err&&!E.data)return;
      if(E.replay){startTimer();return}
      E.schedule();
    },
    schedule(){
      clearTimeout(E.pollT);if(E.done){finishDuel();return}
      const low=S.left!=null&&S.left<300,vlow=S.left!=null&&S.left<120; // free plan: stretch requests so one full match fits in a day
      const wait=E.status==='HT'?(vlow?300000:180000):LIVE.has(E.status)?(S.left!=null&&S.left<60?180000:vlow?150000:low?90000:60000):(E.status==='NS'||E.status==='TBD')?Math.min(300000,Math.max(60000,new Date(f.kickoff)-Date.now())):120000;
      const w2=S.preview?Math.min(wait,20000):wait;E.nextAt=Date.now()+w2;
      E.pollT=setTimeout(async()=>{await E.fetch();if(S.view==='live')updateLive();E.schedule()},w2);
    },
    async refresh(){clearTimeout(E.pollT);await E.fetch();if(S.view==='live')updateLive();E.schedule()},
    stop(){clearTimeout(E.pollT)}
  };
  return E;
}

// ================= Timer for sim + replay =================
function startTimer(){stopTimer();S.timer=setInterval(tick,1000/S.speed)}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function tick(){
  const E=S.eng;if(!E||S.paused||S.view!=='live')return;
  if(penHold(E)){updateLive();return}
  const before=totals();E.tick();
  if(E.done){finishDuel();return}

}
function totals(){const t=S.eng.tally(),a=powerAdjust();return ALL().map(i=>sideScore(i,t,a).total)}
function finishDuel(){
  stopTimer();const E=S.eng;if(!E.done)E.finish();
  if(E.saved)return;E.saved=true;E.stop();
  const t=E.tally(),tot=totals(),f=S.fixture;

    onlineFetch({body:{action:'final',code:S.online.code,token:S.online.token,tot}}).then(()=>{S.league=null}).catch(()=>{})}

  S.history.unshift({at:Date.now(),names:[pname(me),pname(1-me)],tot:[tot[me],tot[1-me]],score:[t.hs,t.as],teams:[TEAMS[f.home].short,TEAMS[f.away].short],out,real:f.kind==='real',online:S.mode==='online',
    comeback:!!(S.htTot&&S.htTot[me]<S.htTot[1-me]&&out==='W'),pwGain,swap:swapUsed(me)});

async function leagueFetch(opts){
  let r,b;try{r=await fetch('/api/league'+(opts.get?'?'+new URLSearchParams(opts.get):''),opts.body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(opts.body)}:{});b=await r.json()}
  catch(e){throw new Error('No connection. Check your internet and try again.')}
  if(!r.ok||b.error)throw new Error(b.error||'Something went wrong.');return b;
}
async function ensureProfile(name){

}

// ================= Share card (1080×1920 story image) =================
async function resultCard(){
  const f=S.fixture,E=S.eng,t=E.tally(),a=powerAdjust(),sc=[0,1].map(i=>sideScore(i,t,a)),tot=sc.map(x=>x.total);

  g=x.createRadialGradient(W/2,560,40,W/2,560,760);g.addColorStop(0,w===-1?'rgba(169,187,207,.22)':'rgba(255,215,124,.28)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=4;
  for(let i=0;i<8;i++){x.fillStyle=i%2?'rgba(255,255,255,.015)':'rgba(0,0,0,0)';x.fillRect(0,1080+i*105,W,105)}
  x.beginPath();x.moveTo(0,1660);x.lineTo(W,1660);x.stroke();
  x.strokeRect(-4,60,W+8,H-120);
  const txt=(s,X,Y,font,col,al='center',ls=0)=>{x.font=font;x.fillStyle=col;x.textAlign=al;if('letterSpacing' in x)x.letterSpacing=ls+'px';x.fillText(s,X,Y);if('letterSpacing' in x)x.letterSpacing='0px'};
  const fit=(s,max,size,weight,fam)=>{let z=size;x.font=`${weight} ${z}px ${fam}`;while(x.measureText(s).width>max&&z>20){z-=4;x.font=`${weight} ${z}px ${fam}`}return `${weight} ${z}px ${fam}`};
  // Header
  txt('FOOTBALL',W/2,190,`800 92px ${D}`,TXT,'center',6);
  x.font=`800 92px ${D}`;const lw=x.measureText('LIVE').width+52,dw=x.measureText('DUEL').width,sx=W/2-(lw+dw)/2;
  txt('LIVE',sx,280,`800 92px ${D}`,ACC,'left',6);txt('DUEL',sx+lw,280,`800 92px ${D}`,TXT,'left',6);
  // Match
  const ms=`${TEAMS[f.home].name}  ${t.hs} – ${t.as}  ${TEAMS[f.away].name}`;
  x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.roundRect?x.roundRect(90,340,W-180,92,46):x.rect(90,340,W-180,92);x.fill();
  txt(ms,W/2,402,fit(ms,W-240,40,'600',I),TXT);
  // Verdict
  txt(w===-1?'🤝':'🏆',W/2,640,`160px ${I}`,GOLD);
  const v=w===-1?'DRAW':`${pname(w).toUpperCase()} ${pname(w)==='You'?'WIN':'WINS'}`;
  txt(v,W/2,800,fit(v,W-160,150,'800',D),w===-1?TXT:GOLD,'center',2);
  const n=k=>k<0?'−'+(-k):String(k);
  txt(`${n(tot[0])} : ${n(tot[1])}`,W/2,1010,`800 230px ${D}`,TXT);
  txt(`${pname(0).toUpperCase()}   VS   ${pname(1).toUpperCase()}`,W/2,1080,fit(`${pname(0)}   VS   ${pname(1)}`.toUpperCase(),W-200,44,'700',D),MUT,'center',4);
  // Players: best of each side
  const shirtAt=(id,cx,cy,sz)=>{const p=PL[id],c=TEAMS[p.team]?TEAMS[p.team].color:'#8899aa',k=sz/64;x.save();x.translate(cx-sz/2,cy-sz*0.44);x.scale(k,k);
    x.fillStyle=c;x.fill(new Path2D('M21 3 9 9 2 22l10 5 3-5v32h34V22l3 5 10-5-7-13-12-6c-2 5-6 8-11 8s-9-3-11-8z'));x.restore();
    const num=p.num!=null&&p.num!==''?String(p.num):(p.pos||'');txt(num,cx,cy+sz*0.2,`800 ${sz*0.3}px ${D}`,'#06121f')};
  [0,1].forEach(i=>{const cx=i===0?W*0.27:W*0.73;const rows=sc[i].rows.slice().sort((p,q)=>q.pts-p.pts),best=rows[0];
    x.fillStyle=w===i?'rgba(255,215,124,.10)':'rgba(255,255,255,.05)';x.strokeStyle=w===i?'rgba(255,215,124,.5)':'rgba(255,255,255,.12)';x.lineWidth=3;
    x.beginPath();x.roundRect?x.roundRect(cx-215,1180,430,420,36):x.rect(cx-215,1180,430,420);x.fill();x.stroke();
    txt(pname(i).toUpperCase(),cx,1245,fit(pname(i).toUpperCase(),380,46,'800',D),w===i?GOLD:MUT,'center',3);
    if(best){shirtAt(best.id,cx,1360,150);txt(PL[best.id].name,cx,1490,fit(PL[best.id].name,380,40,'700',I),TXT);
      txt(`${n(best.pts)} pts · top scorer`,cx,1545,`500 30px ${I}`,MUT)}});
  // Forfeit
  let fy=1700;
  if(w!==-1&&S.dares&&S.dares[w]&&S.dareOk[w]){txt('🔓 FORFEIT UNLOCKED',W/2,fy,`800 44px ${D}`,GOLD,'center',4);
    const q=`${pname(1-w)} must: “${S.dares[w]}”`;txt(q,W/2,fy+62,fit(q,W-160,38,'600',I),TXT)}
  else txt('Pick 2 players. Watch live. Beat your friends.',W/2,fy,`500 34px ${I}`,MUT);
  txt((location.host||'football-live-duel.vercel.app').toUpperCase(),W/2,H-90,`700 34px ${D}`,ACC,'center',6);
  return await new Promise(r=>cv.toBlob(r,'image/png'));
}
async function shareCard(btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent='Making your card…';
  try{
    const blob=await resultCard();const file=new File([blob],'football-live-duel-result.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]})}catch(e){if(e.name!=='AbortError')throw e}}
    else{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Image saved')}
  }catch(e){toast('Could not make the image')}
