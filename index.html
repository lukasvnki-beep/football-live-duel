function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

// ================= Profile =================
const BADGES=[
  {i:'🎉',n:'First win',d:'Win a duel',ok:(h)=>h.some(x=>x.out==='W')},
  {i:'↩️',n:'Comeback king',d:'Win after trailing at half time',ok:h=>h.some(x=>x.comeback)},
  {i:'⚡',n:'Power-up master',d:'Gain 50+ pts from power-ups in one duel',ok:h=>h.some(x=>(x.pwGain||0)>=50)},
  {i:'🔥',n:'On fire',d:'Win 3 in a row',ok:(h,me)=>streakMax(h)>=3||(me&&me.best>=3)},
  {i:'👑',n:'Unstoppable',d:'Win 5 in a row',ok:(h,me)=>streakMax(h)>=5||(me&&me.best>=5)},
  {i:'🧹',n:'Clean sweep',d:'Win by 100+ pts',ok:h=>h.some(x=>x.out==='W'&&x.tot[0]-x.tot[1]>=100)},
  {i:'🎯',n:'No swap needed',d:'Win a real match without swapping',ok:h=>h.some(x=>x.out==='W'&&x.real&&x.swap===false)},
  {i:'📱',n:'Online',d:'Play a duel on two phones',ok:h=>h.some(x=>x.online)},
  {i:'🤝',n:'Social',d:'Have 3 friends',ok:(h,me,fr)=>fr>=3},
  {i:'🏟️',n:'Regular',d:'Play 10 duels',ok:h=>h.length>=10}];
function streakMax(h){let m=0,c=0;[...h].reverse().forEach(x=>{c=x.out==='W'?c+1:0;m=Math.max(m,c)});return m}
function badgesHtml(){const L=S.league,me=L&&L.me,fr=L&&L.friends?L.friends.filter(x=>x&&(!me||x.id!==me.id)).length:0,h=S.history;
  const got=BADGES.map(b=>!!b.ok(h,me,fr)),n=got.filter(Boolean).length;
  return `<div class="section-title"><h2 style="font-size:1.2rem">Badges</h2><span class="small muted">${n}/${BADGES.length} unlocked</span></div>
    <div class="badges">${BADGES.map((b,k)=>`<div class="badge ${got[k]?'on':'off'}"><span class="bi">${b.i}</span><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div>`}
// ================= Accounts: email code or Google, same profile on every phone =================
async function accFetch(body){
  let r,b;try{r=await fetch('/api/account',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});b=await r.json()}
  catch(e){throw new Error('No connection. Check your internet and try again.')}
  if(!r.ok||b.error)throw new Error(b.error||'Something went wrong.');return b;
}
const localData=()=>({name:S.names[0]&&S.names[0]!=='You'?S.names[0]:'',history:S.history});
function mergeHist(a,b){const seen=new Set(),out=[];[...(a||[]),...(b||[])].sort((x,y)=>(y.at||0)-(x.at||0)).forEach(x=>{if(x&&x.at&&!seen.has(x.at)){seen.add(x.at);out.push(x)}});return out.slice(0,30)}
function applyAccount(b){
  store.set('fld.me',{id:b.id,token:b.token});store.set('fld.acct',{email:b.email||'',google:!!b.google});
  if(b.data){S.history=mergeHist(b.data.history,[]);store.set('fld.history',S.history)}
  const nm=store.get('fld.names',['You','Friend']);nm[0]=(b.me&&b.me.name)||nm[0];store.set('fld.names',nm);S.names[0]=nm[0];
  store.set('fld.onboarded',1);S.acct={};S.league=null;
}
// Called after each duel and when this phone has duels the account does not have yet
function syncAccount(){const me=store.get('fld.me',null);if(!me||!store.get('fld.acct',null))return;accFetch({action:'sync',id:me.id,token:me.token,data:localData()}).catch(()=>{})}
function accountHtml(){
  const acc=store.get('fld.acct',null),A=S.acct||(S.acct={});
  if(acc)return `<div class="lg" id="acct"><h3>Account</h3><p class="small" style="margin:0">Signed in${acc.email?` as <b>${esc(acc.email)}</b>`:' with Google'}. Your stats, friends and badges are saved on every phone where you sign in.</p>
    <div class="addf"><button class="btn ghost" id="acout" style="padding:10px 14px">Sign out</button></div>
    <button class="linkbtn" id="acdel" style="color:var(--red)">${A.sure?'Tap again to delete your account for good':'Delete my account'}</button></div>`;
  const cfg=S.acctCfg;
  return `<div class="lg" id="acct"><h3>Save your profile</h3><p class="small muted" style="margin:0">Sign in to keep your stats, friends and badges, and play on any phone. Your duels on this phone come with you.</p>
    ${A.step==='code'?`<p class="small" style="margin:0">We sent a 6-digit code to <b>${esc(A.email)}</b>.${A.dev?` Preview test code: <b>${esc(A.dev)}</b>`:''}</p>
      <div class="addf"><input id="accode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"><button class="btn" id="acok" style="padding:10px 14px">Sign in</button></div>
      <button class="linkbtn" id="acback" style="text-align:left;padding:0">Use another email</button>`
    :`<div class="addf"><input id="acmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="Your email" value="${esc(A.email||'')}"><button class="btn" id="acsend" style="padding:10px 14px">Get code</button></div>`}
    ${cfg&&cfg.google&&A.step!=='code'?'<div id="gbtn" style="min-height:44px;display:flex;justify-content:center"></div>':''}
    <p class="small muted" style="margin:0">By signing in you accept the <a href="/privacy.html" style="color:inherit">privacy policy</a>.</p></div>`;
}
function rerenderAccount(){const el=document.getElementById('acct');if(!el)return;el.outerHTML=accountHtml();bindAccount()}
async function finishSignIn(p){
  const me=store.get('fld.me',null);
  const b=await accFetch({...p,id:me&&me.id,token:me&&me.token,data:localData()});
  applyAccount(b);toast(b.merged?'Signed in. Your stats were added to your account':'Signed in');render();
}
function bindAccount(){
  const A=S.acct||(S.acct={}),$=id=>document.getElementById(id);
  if(!S.acctCfg&&!store.get('fld.acct',null))accFetch().then(c=>{S.acctCfg=c;if(c.google)rerenderAccount()}).catch(()=>{});
  if($('acsend'))$('acsend').onclick=async()=>{const e=$('acmail').value.trim();if(!e){toast('Enter your email');return}$('acsend').disabled=true;
    try{const b=await accFetch({action:'sendcode',email:e});S.acct={step:'code',email:e,dev:b.devCode||''};rerenderAccount();setTimeout(()=>$('accode')&&$('accode').focus(),50)}catch(x){toast(x.message);$('acsend').disabled=false}};
  if($('acok'))$('acok').onclick=async()=>{const c=$('accode').value.trim();if(c.length!==6){toast('Enter the 6-digit code');return}$('acok').disabled=true;
    try{await finishSignIn({action:'verify',email:A.email,code:c})}catch(x){toast(x.message);$('acok').disabled=false}};
  if($('accode'))$('accode').oninput=e=>{if(e.target.value.replace(/\D/g,'').length===6)$('acok').click()};
  if($('acback'))$('acback').onclick=()=>{S.acct={email:A.email};rerenderAccount()};
  if($('gbtn'))loadGoogle().then(g=>{if(!g||!$('gbtn'))return;
    g.accounts.id.initialize({client_id:S.acctCfg.google,callback:async r=>{try{await finishSignIn({action:'google',credential:r.credential})}catch(x){toast(x.message)}}});
    g.accounts.id.renderButton($('gbtn'),{theme:'filled_black',size:'large',shape:'pill',text:'continue_with',width:280})});
  if($('acout'))$('acout').onclick=async()=>{const me=store.get('fld.me',null);if(me)accFetch({action:'signout',id:me.id,token:me.token}).catch(()=>{});
    ['fld.me','fld.acct','fld.history','fld.online','fld.active'].forEach(k=>store.del(k));store.set('fld.names',['You','Friend']);S.names=['You','Friend'];S.history=[];S.league=null;S.acct={};toast('Signed out');render()};
  if($('acdel'))$('acdel').onclick=async()=>{if(!A.sure){A.sure=1;rerenderAccount();return}
    const me=store.get('fld.me',null);$('acdel').disabled=true;
    try{if(me)await accFetch({action:'delete',id:me.id,token:me.token});
      try{Object.keys(localStorage).filter(k=>k.startsWith('fld.')).forEach(k=>localStorage.removeItem(k))}catch(e){}
      S.names=['You','Friend'];S.history=[];S.league=null;S.acct={};toast('Your account and data are deleted');S.view='onboard';S.obStep=0;render()}
    catch(x){toast(x.message);A.sure=0;rerenderAccount()}};
}

function viewSettings(){

  const tg=(id,on,title,sub,dis)=>`<label class="setrow${dis?' dim':''}"><span><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span><input type="checkbox" class="sw" id="${id}" ${on?'checked':''}></label>`;
  const lb=(c,flag,name)=>`<button data-lang="${c}" aria-pressed="${L===c}" data-noi18n style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem"><span style="font-size:1.4rem;line-height:1">${flag}</span>${name}</button>`;
  app.innerHTML=`<section class="screen">
    <h2 style="font-size:2.4rem;text-transform:uppercase">Settings</h2>
    <div class="lg"><h3>Language</h3><div class="seg" style="grid-template-columns:repeat(3,1fr)">${lb('fr','🇫🇷','Français')}${lb('en','🇬🇧','English')}${lb('es','🇪🇸','Español')}</div></div>
    <div class="lg"><h3>Sound</h3>
      ${tg('s-all',o.all,'Mute everything','Turns off music and sound effects')}
      ${tg('s-music',o.music,'Music','Background music, like in games',o.all)}
      ${tg('s-sfx',o.sfx,'Sound effects','Goals, picks, power-ups and taps',o.all)}
      ${tg('s-vib',vib,'Vibration','Vibrate on goals and power-ups')}
    </div>
  </section>`;
  app.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{if(FS)FS.setLang(b.dataset.lang);viewSettings()});
  const on=(id,f)=>{document.getElementById(id).onchange=e=>{f(e.target.checked);viewSettings()}};
  on('s-all',v=>FS&&FS.setOpt('all',v));
  on('s-music',v=>FS&&FS.setOpt('music',v));
  on('s-sfx',v=>{FS&&FS.setOpt('sfx',v);if(v)sfx('pick')});

}
let gsiP=null;
function loadGoogle(){return gsiP||(gsiP=new Promise(ok=>{if(window.google&&google.accounts)return ok(google);const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>ok(window.google);s.onerror=()=>{gsiP=null;ok(null)};document.head.appendChild(s)}))}

})();
